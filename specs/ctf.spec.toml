"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/ -k 'referee_invalid_json'"

[[criteria]]
description = """
Referees — a score outside 0 to 1, or an aspect absent from the spec, is rejected.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/ -k 'referee_score_range'"

