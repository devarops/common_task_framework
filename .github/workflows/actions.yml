name: Tests
on:
  push:
    branches: [develop]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Build image
      run: docker build --tag evaristor/common_task_framework .
    - name: Check formatting
      run: docker run --volume $PWD:/workdir evaristor/common_task_framework make check
    - name: Run tests
      run: docker run --volume $PWD:/workdir evaristor/common_task_framework make tests
    - name: Verify acceptance criteria
      run: docker run --volume $PWD:/workdir evaristor/common_task_framework make verify
